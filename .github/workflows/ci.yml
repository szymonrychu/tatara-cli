name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: szymonrychu/tatara-operator/.github/workflows/ci-shared.yml@v1.35.1
    with:
      runner-label: tatara-cli
      smoke-binary: ./bin/tatara
      # cli's smoke has always been a hard gate (no `|| true`), unlike the
      # shared default which tolerates smoke failure.
      smoke-allow-failure: false
      build-needs-cgo: true
      # cli owns its own image publish (build.sh's shortsha/version tag-mode
      # split exists specifically to avoid double-pushing the same immutable
      # Harbor tag from ci.yml and release.yml), so the shared `image` job
      # stays off here.
      enable-image: false
    secrets: inherit

  image:
    if: ${{ github.event_name == 'push' }}
    runs-on: tatara-cli
    needs: [ci]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install buildctl
        run: |
          curl -sSfL "https://github.com/moby/buildkit/releases/download/v0.18.2/buildkit-v0.18.2.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local bin/buildctl
      - name: build and push image
        run: bash .github/ci/build.sh "${{ github.event.repository.name }}" shortsha
