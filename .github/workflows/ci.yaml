name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          # Need golangci-lint built with go1.25+ (the toolchain we pin in go.mod).
          # v2.1.6 was built with go1.24 and refuses to load a 1.25 module.
          version: v2.12.2
      - run: go test -race -count=1 ./...
