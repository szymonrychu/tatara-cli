name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          # Match the local mise-installed version (matches .golangci.yml schema).
          # v2.12+ tightened the schema and rejects exclude-rules / disable-all.
          version: v2.11.4
      - run: go test -race -count=1 ./...
