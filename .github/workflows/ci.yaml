name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          # Match the local mise-installed version (matches .golangci.yml schema).
          version: v2.11.4
          # `config verify` is stricter than the actual `run`; the .golangci.yml
          # carries some legacy v1 keys that the linter still tolerates at run.
          # Fixing the config is tracked as v1.1 boy-scout work.
          verify: false
      - run: go test -race -count=1 ./...
